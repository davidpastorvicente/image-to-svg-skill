<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D floor plan</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8f0;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Avenir Next', sans-serif; color: #222; }
  canvas { display: block; }
  #panel { position: absolute; top: 12px; left: 12px; width: 230px; padding: 12px 14px;
    background: rgba(255,255,255,.92); border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  #panel h1 { margin: 0 0 10px; font-size: 16px; }
  #panel .modes { display: flex; gap: 6px; margin-bottom: 10px; }
  #panel button { flex: 1; padding: 6px 4px; border: 1px solid #bbb; border-radius: 6px;
    background: #fff; font: inherit; cursor: pointer; }
  #panel button.active { background: #333; color: #fff; border-color: #333; }
  #panel label { display: block; margin: 3px 0; cursor: pointer; }
  #panel select { width: 100%; margin-top: 8px; padding: 4px; font: inherit; }
  #help { margin-top: 10px; font-size: 12px; color: #555; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 0 2px #000; display: none; }
  #room { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: none;
    padding: 6px 14px; border-radius: 16px; background: rgba(0,0,0,.55); color: #fff; }
</style>
</head>
<body>
<div id="panel">
  <h1 id="title"></h1>
  <div class="modes">
    <button data-mode="model">Model</button>
    <button data-mode="plan">Plan</button>
    <button data-mode="walk">Walk</button>
  </div>
  <label><input type="checkbox" id="show-ceiling"> Ceiling</label>
  <label><input type="checkbox" id="show-doors" checked> Doors</label>
  <label><input type="checkbox" id="show-labels" checked> Room names</label>
  <select id="go-to"><option value="">Go to…</option></select>
  <div id="help"></div>
</div>
<div id="crosshair"></div>
<div id="room"></div>
<script>/*SCENE*/</script>
<script>/*VIEWER*/</script>
</body>
</html>
